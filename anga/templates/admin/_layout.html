{% extends "base.html" %}
{% block title %}Operations{% endblock %}
{% block body_class %}admin{% endblock %}
{% block content %}
  <div class="container admin-layout">
    <nav class="admin-nav no-print" aria-label="Operations">
      {% for endpoint, label in admin_nav %}
        <a href="{{ url_for(endpoint) }}"{% if request.endpoint == endpoint %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    <div>
      {% block admin %}{% endblock %}
    </div>
  </div>
{% endblock %}
